[project]
name = "llm-service"
version = "0.1.0"
description = "FastAPI LLM service backed by SGLang, with RabbitMQ event-driven triggers"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "aio-pika>=9.4",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
tokenizer = ["transformers>=4.40"]
finetune = ["unsloth", "trl", "datasets", "openpyxl"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
